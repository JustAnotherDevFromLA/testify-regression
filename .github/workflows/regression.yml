name: Daily site regression

on:
  push:
  pull_request:
  schedule:
    # 08:00 Pacific Standard Time (09:00 during daylight saving time).
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Test scope for an on-demand run
        type: choice
        options:
          - full
          - smoke
        default: full
        required: true

permissions:
  contents: read

concurrency:
  group: site-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: UI test gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and lint
        run: |
          npm run typecheck
          npm run lint

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Prepare Monocart history cache
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
        run: mkdir -p .cache

      - name: Restore previous Monocart report history
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
        uses: actions/cache/restore@v4
        with:
          path: .cache/monocart-history.json
          key: monocart-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            monocart-history-${{ github.ref_name }}-

      - name: Run regression suite
        env:
          REGRESSION_SUITE: ${{ inputs.suite || (github.event_name == 'schedule' && 'full' || 'smoke') }}
        run: |
          if [ "$REGRESSION_SUITE" = "smoke" ]; then
            npm run test:smoke
          else
            npm test
          fi

      - name: Update cached Monocart history
        id: update-monocart-history
        if: ${{ always() && !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')) && hashFiles('monocart-report/index.json') != '' }}
        run: cp monocart-report/index.json .cache/monocart-history.json

      - name: Save Monocart report history
        if: ${{ always() && !cancelled() && steps.update-monocart-history.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/monocart-history.json
          key: monocart-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testify-regression-report-${{ github.run_id }}
          path: |
            monocart-report/
            test-results/
          retention-days: 14
